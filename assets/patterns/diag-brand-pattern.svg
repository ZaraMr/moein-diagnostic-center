<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <pattern id="diagBrandPattern" width="140" height="140" patternUnits="userSpaceOnUse">

      <!-- هسته مرکزی ECU -->
      <circle cx="70" cy="70" r="5" fill="white" opacity="0.28"/>

      <!-- حلقه داده (Data Ring) -->
      <circle cx="70" cy="70" r="28" fill="none" stroke="white" stroke-width="1" opacity="0.12"/>
      <circle cx="70" cy="70" r="48" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>

      <!-- نودهای ارتباطی -->
      <circle cx="70" cy="20" r="2.5" fill="white" opacity="0.22"/>
      <circle cx="70" cy="120" r="2.5" fill="white" opacity="0.22"/>
      <circle cx="20" cy="70" r="2.5" fill="white" opacity="0.22"/>
      <circle cx="120" cy="70" r="2.5" fill="white" opacity="0.22"/>

      <!-- اتصال‌های ECU -->
      <path d="M70 70 L70 20" stroke="white" stroke-width="1" opacity="0.14"/>
      <path d="M70 70 L70 120" stroke="white" stroke-width="1" opacity="0.14"/>
      <path d="M70 70 L20 70" stroke="white" stroke-width="1" opacity="0.14"/>
      <path d="M70 70 L120 70" stroke="white" stroke-width="1" opacity="0.14"/>

      <!-- خطوط دیتا (Data Flow) -->
      <path d="M20 20 L120 120" stroke="white" stroke-width="1" opacity="0.06"/>
      <path d="M120 20 L20 120" stroke="white" stroke-width="1" opacity="0.06"/>

      <!-- پالس دیتا (CAN Signal feel) -->
      <path d="M10 110 L35 110 L40 105 L50 115 L60 110 L80 110"
            stroke="white" stroke-width="1" fill="none" opacity="0.10"/>

    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#diagBrandPattern)" />
</svg>